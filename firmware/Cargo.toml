[package]
name = "potok-m-firmware"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "potok_m_firmware"
path = "src/lib.rs"

[[bin]]
name = "potok-m-firmware"
path = "src/main.rs"

[dependencies]
# Wire types and codec are owned by the protocol repo; never copy them here.
potok-protocol = { git = "https://github.com/rocket-team-m/potok-m-protocol.git", rev = "fdc485d14e8e10f500c2b81fce4ca9e5b1e64a55" }

# Hardware-only dependencies. Host `cargo test` never sees them.
[target.'cfg(target_os = "none")'.dependencies]
# TODO(bom): confirm the exact STM32H743 variant from the schematic/BOM.
embassy-stm32 = { version = "0.6.0", features = ["stm32h743zi", "time-driver-tim2", "exti"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5.1"
defmt = "1.0"
defmt-rtt = "0.4"
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
