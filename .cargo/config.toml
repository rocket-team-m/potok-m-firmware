[target.thumbv7em-none-eabihf]
# NOT ASSIGNED: exact H723 package is pending BOM sign-off (ZG assumed).
# probe-rs chip spelling follows its STM32 `...Tx` convention; verify with
# `probe-rs chip list` before a board session.
runner = ["probe-rs", "run", "--chip", "STM32H723ZGTx"]
# link.x from cortex-m-rt includes memory.x; defmt.x places the log sections.
rustflags = [
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
]
