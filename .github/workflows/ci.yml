name: ci

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  thumb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      # Pin RUSTC to the rustup stable rustc explicitly. `rustup run stable
      # cargo` relies on PATH finding a rustup proxy; a system cargo/rustc
      # (e.g. Arch's) ignores RUSTUP_TOOLCHAIN and lacks the thumb core,
      # failing with E0463. See docs/TOOLCHAIN.md.
      - run: RUSTC=$(rustup which rustc --toolchain stable) cargo check --target thumbv7em-none-eabihf
